<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree of Elements | SDT Nuclear Geometry</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: #0a0a12;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .title {
            text-align: center;
            font-size: 2.2em;
            font-weight: bold;
            background: linear-gradient(90deg, #ffd700, #ff6b00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        
        /* Tree Container */
        .tree-container {
            position: relative;
            width: 100%;
            min-height: 1800px;
        }
        
        /* Shell rings */
        .shell {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .shell-label {
            position: absolute;
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            white-space: nowrap;
        }
        
        /* Element boxes */
        .element {
            position: absolute;
            width: 52px;
            height: 62px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .element:hover {
            transform: scale(1.15);
            z-index: 100;
            border-color: #fff;
        }
        
        .element.selected {
            transform: scale(1.2);
            z-index: 101;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        
        .element .z {
            font-size: 0.6em;
            color: rgba(255,255,255,0.6);
        }
        
        .element .symbol {
            font-size: 1.4em;
            font-weight: bold;
        }
        
        .element .structure {
            font-size: 0.5em;
            color: rgba(255,255,255,0.7);
            text-align: center;
            max-width: 48px;
            overflow: hidden;
            white-space: nowrap;
        }
        
        /* Color classes */
        .pure-alpha {
            background: linear-gradient(135deg, #c41e3a, #8b0000);
            box-shadow: 0 0 15px rgba(196,30,58,0.4);
        }
        
        .non-magnetic {
            background: linear-gradient(135deg, #2d2d44, #1a1a2e);
        }
        
        .magnetic-pos {
            background: linear-gradient(135deg, #0d9488, #065f5b);
            box-shadow: 0 0 10px rgba(13,148,136,0.3);
        }
        
        .magnetic-neg {
            background: linear-gradient(135deg, #6366f1, #4338ca);
            box-shadow: 0 0 10px rgba(99,102,241,0.3);
        }
        
        .boundary {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            box-shadow: 0 0 12px rgba(255,215,0,0.4);
        }
        
        .post-boundary {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            box-shadow: 0 0 10px rgba(168,85,247,0.3);
        }
        
        .unstable {
            background: linear-gradient(135deg, #444, #222);
            opacity: 0.6;
        }
        
        /* Tree of Life spine */
        .tol-path {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            background: linear-gradient(180deg, #ffd700, #c41e3a, #ffd700);
            z-index: 1;
        }
        
        .tol-node {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #c41e3a);
            border: 3px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 25px rgba(255,215,0,0.5);
        }
        
        .tol-node:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 0 35px rgba(255,215,0,0.7);
        }
        
        .tol-node .symbol {
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
        }
        
        .tol-node .label {
            font-size: 0.6em;
            color: rgba(255,255,255,0.8);
        }
        
        .tol-node .alpha {
            font-size: 0.7em;
            color: #fff;
            font-weight: bold;
        }
        
        /* Connection lines */
        .connection {
            position: absolute;
            background: rgba(255,215,0,0.2);
            z-index: 0;
        }
        
        /* Info panel */
        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.95);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            width: 320px;
            z-index: 1000;
        }
        
        .info-panel h2 {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 8px;
        }
        
        .info-panel .big-symbol {
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .info-panel .name {
            font-size: 1.2em;
            color: #aaa;
        }
        
        .info-panel .details {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 12px;

        .info-panel .structure-box {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 10px;
            font-family: 'Courier New', monospace;
        }
        
        .info-panel .structure-box .label {
            font-size: 0.7em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .info-panel .alpha { color: #ff6b6b; }
        .info-panel .tri { color: #4ecdc4; }
        .info-panel .triple { color: #a855f7; }
        .info-panel .d-unit { color: #ffd700; }
        
        .info-panel .magnetic-status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85em;

        .info-panel .magnetic-status.mag {
            background: rgba(13,148,136,0.2);

            background: rgba(100,100,100,0.2);

            color: #aaa;

        /* Shell arc labels */
        .arc-label {
            position: absolute;
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
            font-weight: bold;
        }

// Pure alpha spine (T=0, non-magnetic)
const ALPHA_SPINE = [
    { z: 2, symbol: 'He', alpha: 1, name: 'Keter', geometry: 'Point' },
    { z: 6, symbol: 'C', alpha: 3, name: 'Chokmah', geometry: 'Triangle' },
    { z: 8, symbol: 'O', alpha: 4, name: 'Binah', geometry: 'Tetrahedron' },

    { z: 18, symbol: 'Ar', alpha: 9, name: 'Netzach', geometry: 'Tricapped' },
    { z: 20, symbol: 'Ca', alpha: 10, name: 'Malkuth', geometry: 'Shell Closure' }
];

// Shell definitions
const SHELLS = [
    { start: 1, end: 2, label: 'K (n=1)', radius: 80 },
    { start: 3, end: 10, label: 'L (n=2)', radius: 180 },
    { start: 11, end: 18, label: 'M (n=3)', radius: 300 },
    { start: 19, end: 36, label: 'N (n=4)', radius: 450 },
    { start: 37, end: 54, label: 'O (n=5)', radius: 620 },
    { start: 55, end: 86, label: 'P (n=6)', radius: 820 }
];

const container = document.getElementById('treeContainer');

// Get element class
function getElementClass(el) {
    const [Z, sym, name, N, alpha, tri, triple, hasD, spin, mu, magnetic] = el;
    const D = 2 * Z - N;
    const T = N - Z;
    
    // Pure alpha spine
    if (tri === 0 && triple === 0 && !hasD && alpha > 0) {
        return 'pure-alpha';
    }
    
    // Boundary (D = T)
    if (D === T && tri > 0) {
        return 'boundary';
    }
    
    // Post-boundary
    if (triple > 0) {
        return 'post-boundary';
    }
    
    // Unstable
    if (Z >= 84 || sym === 'Tc' || sym === 'Pm') {
        return 'unstable';
    }
    
    // Non-magnetic (even tri-α)
    if (!magnetic || spin === 0) {
        return 'non-magnetic';
    }
    
    // Magnetic with sign
    if (mu !== null && mu < 0) {
        return 'magnetic-neg';
    }
    
    return 'magnetic-pos';
}

// Get structure string
function getStructure(el) {
    const [Z, sym, name, N, alpha, tri, triple, hasD] = el;
    let parts = [];
    if (alpha > 0) parts.push(`${alpha}α`);
    if (tri > 0) parts.push(`${tri}×tri-α`);
    if (triple > 0) parts.push(`${triple}×triple`);
    if (hasD) parts.push('D');
    return parts.join(' + ') || 'p';
}

// Build the visualization
function buildTree() {
    const centerX = 700;
    const topY = 60;
    
    // Draw shells as semicircular arcs
    SHELLS.forEach((shell, i) => {
        const arc = document.createElement('div');
        arc.className = 'shell';
        arc.style.width = shell.radius * 2 + 'px';
        arc.style.height = shell.radius * 2 + 'px';
        arc.style.top = (topY + 30 - shell.radius) + 'px';
        arc.style.borderColor = `rgba(255,255,255,${0.15 - i * 0.02})`;
        container.appendChild(arc);
        
        // Shell label
        const label = document.createElement('div');
        label.className = 'arc-label';
        label.textContent = shell.label;
        label.style.left = (centerX + shell.radius + 10) + 'px';
        label.style.top = (topY + 30) + 'px';
        container.appendChild(label);
    });
    
    // Draw alpha spine (Tree of Life)
    const spineTop = topY + 50;
    const spineSpacing = 160;
    
    // Vertical path
    const path = document.createElement('div');
    path.className = 'tol-path';
    path.style.top = spineTop + 'px';
    path.style.height = (ALPHA_SPINE.length - 1) * spineSpacing + 'px';
    container.appendChild(path);
    
    // Tree of Life nodes
    ALPHA_SPINE.forEach((node, i) => {
        const el = document.createElement('div');
        el.className = 'tol-node';
        el.style.top = (spineTop + i * spineSpacing - 35) + 'px';
        el.innerHTML = `
            <div class="alpha">${node.alpha}α</div>
            <div class="symbol">${node.symbol}</div>
            <div class="label">${node.geometry}</div>
        `;
        el.onclick = () => selectElement(ELEMENTS.find(e => e[0] === node.z));
        container.appendChild(el);
    });
    
    // Place all elements in shells
    ELEMENTS.forEach(el => {
        const Z = el[0];
        const shell = SHELLS.find(s => Z >= s.start && Z <= s.end);
        if (!shell) return;
        
        // Skip elements on the spine (they're shown as big nodes)
        const isSpine = ALPHA_SPINE.some(s => s.z === Z);
        if (isSpine) return;
        
        const shellSize = shell.end - shell.start + 1;
        const posInShell = Z - shell.start;
        
        // Spread elements in arc around center
        // Left side for magnetic, right side for non-magnetic
        const magnetic = el[10];
        const side = magnetic ? -1 : 1;
        
        // Calculate angle position
        const angleRange = Math.PI * 0.8; // 144 degrees arc
        const startAngle = Math.PI / 2 - angleRange / 2;
        
        // Separate magnetic and non-magnetic in this shell
        const shellElements = ELEMENTS.filter(e => {
            const eZ = e[0];
            return eZ >= shell.start && eZ <= shell.end && !ALPHA_SPINE.some(s => s.z === eZ);
        });
        
        const magElements = shellElements.filter(e => e[10]);
        const nonMagElements = shellElements.filter(e => !e[10]);
        
        let angle, radius;
        
        if (magnetic) {
            const idx = magElements.findIndex(e => e[0] === Z);
            const count = magElements.length;
            angle = startAngle + (idx / Math.max(count - 1, 1)) * angleRange;
            radius = shell.radius * 0.85;
        } else {
            const idx = nonMagElements.findIndex(e => e[0] === Z);
            const count = nonMagElements.length;
            angle = Math.PI - startAngle - (idx / Math.max(count - 1, 1)) * angleRange;
            radius = shell.radius * 1.1;
        }
        
        const x = centerX + Math.cos(angle) * radius * side;
        const y = topY + 30 + Math.sin(angle) * radius * 0.6;
        
        const elem = document.createElement('div');
        elem.className = `element ${getElementClass(el)}`;
        elem.style.left = (x - 26) + 'px';
        elem.style.top = (y - 31) + 'px';
        
        const shortStruct = getStructure(el).replace(/×tri-α/g, 't').replace(/×triple/g, 'T');
        elem.innerHTML = `
            <div class="z">${Z}</div>
            <div class="symbol">${el[1]}</div>
            <div class="structure">${shortStruct}</div>
        `;
        elem.onclick = () => selectElement(el);
        container.appendChild(elem);
    });
}

// Selection handler
let selectedEl = null;

function selectElement(el) {
    // Clear previous selection
    document.querySelectorAll('.element.selected, .tol-node.selected').forEach(e => e.classList.remove('selected'));
    
    if (!el) return;
    
    selectedEl = el;
    const [Z, sym, name, N, alpha, tri, triple, hasD, spin, mu, magnetic] = el;
    
    document.getElementById('infoSymbol').textContent = sym;
    document.getElementById('infoSymbol').style.color = magnetic ? '#4ecdc4' : '#ff6b6b';
    document.getElementById('infoName').textContent = name;
    
    const D = 2 * Z - N;
    const T = N - Z;
    document.getElementById('infoDetails').innerHTML = `
        Z=${Z} N=${N} | D=${D} T=${T}<br>
        Spin: ${spin} | μ: ${mu !== null ? mu.toFixed(3) + ' μ<sub>N</sub>' : '—'}
    `;
    
    // Structure with colors
    let struct = '';
    if (alpha > 0) struct += `<span class="alpha">${alpha}α</span>`;
    if (tri > 0) struct += (struct ? ' + ' : '') + `<span class="tri">${tri}×tri-α</span>`;
    if (triple > 0) struct += (struct ? ' + ' : '') + `<span class="triple">${triple}×triple</span>`;
    if (hasD) struct += (struct ? ' + ' : '') + `<span class="d-unit">D</span>`;
    document.getElementById('infoStructure').innerHTML = struct || 'p (single proton)';
    
    const magDiv = document.getElementById('infoMagnetic');
    if (magnetic && spin !== 0) {
        magDiv.className = 'magnetic-status mag';
        const sign = mu > 0 ? 'positive (D-buffered)' : mu < 0 ? 'negative (direct contact)' : '';
        magDiv.innerHTML = `<strong>MAGNETIC</strong> — ${sign}`;
    } else {
        magDiv.className = 'magnetic-status non-mag';
        if (tri === 0 && triple === 0) {
            magDiv.innerHTML = `<strong>NON-MAGNETIC</strong> — Pure α (no wobble source)`;
        } else {
            magDiv.innerHTML = `<strong>NON-MAGNETIC</strong> — Even tri-α (wobbles cancel)`;
        }
    }
}

// Initialize
buildTree();
