<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDT Walkthrough - Spatial Displacement Theory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #root {
      width: 100%;
      height: 100%;
    }
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #d69e2e;
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Loading SDT Walkthrough...</div>
  </div>
  
  <script type="module">
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import React from 'https://esm.sh/react@18';
    
    // Import the walkthrough component
    const { WalkthroughApp } = await import('/src/components/walkthrough/WalkthroughApp.tsx');
    
    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(WalkthroughApp, { mode: 'hybrid' }));
  </script>
</body>
</html>
